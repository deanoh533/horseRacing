name: Sync

on:
  schedule:
    # 출마표: 수·목·금 15:00 KST (발표 14:30 + 여유) = 06:00 UTC
    # 3일치(금·토·일)는 수요일에 동시 발표 → 각 실행이 "남은 주말 전체"를 받는다
    # (수=금토일, 목=토일, 금=일). 수요일 조기 노출 + 목·금 재실행으로 임박 변경(제외마) 갱신.
    - cron: '0 6 * * 3,4,5'
    # 결과 폴러: 금·토·일 KST 10:00~21:45, 15분 간격 = UTC 01:00~12:45
    #   (2026-08-29 설계) 고정 슬롯(19시·23시) 대신 출마표 발주시각(races.st_time) 기반으로
    #   바꿨다 — 발주시각+15분 지난 미확정 경주가 있을 때만 KRA를 부른다(scripts/resultsPoll.ts).
    #   실제 발주시각 분포(2026-08-28 실측): 첫 경주 10:35~12:55, 막경주 16:55(일)~19:55(토, 야간경마).
    #   퍼블릭 레포라 Actions 분 제한 없음 — 자주 돌아도 KRA 호출은 "확인할 게 있을 때만" 발생한다.
    - cron: '*/15 1-12 * * 5,6,0'
    # 캐치업: 매일 KST 07:00 = UTC 22:00(전날) — 요일 무관, 결과 폴러와 독립.
    #   최근 7일 중 여전히 구멍(hole·gap)인 날짜를 찾아 자동 재싱크한다(scripts/catchupSync.ts).
    #   간헐적·다일 KRA 장애(2026-08-23~27 실측)는 하루짜리 재시도로 못 넘으므로,
    #   폴러가 그날 통째로 못 돌아도 다음날 이 캐치업이 자동으로 메꾼다.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '실행할 잡'
        required: true
        type: choice
        options: [racecard, resultsPoll, resultsCatchup]
      date:
        description: '대상 날짜 YYYYMMDD (racecard 전용, 생략 시 오늘+2)'
        required: false
        type: string

env:
  # 러너는 UTC — 이 설정이 없으면 스크립트의 "어제/오늘+2" 계산이 하루 어긋난다
  TZ: Asia/Seoul
  # 러너엔 DuckDB 로컬 미러가 없다 — 예측 생성 읽기를 Supabase로
  DB_SOURCE: supabase
  KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DATE_ARG: ${{ inputs.date }}

jobs:
  racecard:
    name: 출마표 sync (발표일+2)
    # KRA 타임아웃 시 시도당 최대 ~10분(120s×5) × 3일치 × 2 경마장 → 한도를 명시해 둔다
    timeout-minutes: 90
    if: github.event.schedule == '0 6 * * 3,4,5' || (github.event_name == 'workflow_dispatch' && inputs.target == 'racecard')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: raceCardSync
        run: npm run sync:cards -- --fail-on-empty ${DATE_ARG:+--date $DATE_ARG}

  resultsPoll:
    name: 결과 폴러 (발주시각 기반)
    timeout-minutes: 45
    if: github.event.schedule == '*/15 1-12 * * 5,6,0' || (github.event_name == 'workflow_dispatch' && inputs.target == 'resultsPoll')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: resultsPoll
        run: npm run sync:poll

  resultsCatchup:
    name: 결과 캐치업 (최근 7일 구멍)
    timeout-minutes: 45
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && inputs.target == 'resultsCatchup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: catchupSync
        run: npm run sync:catchup
