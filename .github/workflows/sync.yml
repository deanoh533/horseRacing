name: Sync

on:
  schedule:
    # 출마표: 수·목·금 15:00 KST (발표 14:30 + 여유) = 06:00 UTC
    # 3일치(금·토·일)는 수요일에 동시 발표 → 각 실행이 "남은 주말 전체"를 받는다
    # (수=금토일, 목=토일, 금=일). 수요일 조기 노출 + 목·금 재실행으로 임박 변경(제외마) 갱신.
    - cron: '0 6 * * 3,4,5'
    # 결과: 금·토·일 19:00 KST (경주 당일 저녁) = 같은 날 10:00 UTC
    #   당일 저녁이라 "오늘" 날짜를 받는다(아래 results 스텝에서 date +%Y%m%d).
    #   주의: 막판 경주 결과가 아직 KRA에 안 올라왔을 수 있음(과거 01:00은 확정 보장).
    - cron: '0 10 * * 5,6,0'
  workflow_dispatch:
    inputs:
      target:
        description: '실행할 잡'
        required: true
        type: choice
        options: [racecard, results]
      date:
        description: '대상 날짜 YYYYMMDD (생략 시 자동: 출마표=오늘+2, 결과=오늘)'
        required: false
        type: string

env:
  # 러너는 UTC — 이 설정이 없으면 스크립트의 "어제/오늘+2" 계산이 하루 어긋난다
  TZ: Asia/Seoul
  # 러너엔 DuckDB 로컬 미러가 없다 — 예측 생성 읽기를 Supabase로
  DB_SOURCE: supabase
  KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DATE_ARG: ${{ inputs.date }}

jobs:
  racecard:
    name: 출마표 sync (발표일+2)
    if: github.event.schedule == '0 6 * * 3,4,5' || (github.event_name == 'workflow_dispatch' && inputs.target == 'racecard')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: raceCardSync
        run: npm run sync:cards -- --fail-on-empty ${DATE_ARG:+--date $DATE_ARG}

  results:
    name: 결과 sync (당일)
    if: github.event.schedule == '0 10 * * 5,6,0' || (github.event_name == 'workflow_dispatch' && inputs.target == 'results')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: dailySync
        # 당일 저녁 실행 → 스케줄 시 "오늘"(KST, TZ=Asia/Seoul) 날짜를 받는다.
        # 수동 dispatch에서 date 입력 시 그 값 우선.
        run: npm run sync -- --fail-on-empty --date "${DATE_ARG:-$(date +%Y%m%d)}"
